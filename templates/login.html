<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | MediGuide AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 20px; background: #f2f8fa;
      font-family: Arial, sans-serif; color: #132b43;
    }
    .card {
      width: 100%; max-width: 430px; padding: 32px;
      border: 1px solid #e0eaf0; border-radius: 20px;
      background: white; box-shadow: 0 15px 45px #14374b10;
    }
    .brand { color: #087e8b; font-size: 24px; font-weight: 800; }
    h1 { margin-bottom: 8px; font-size: 28px; }
    .muted { color: #637487; font-size: 14px; }
    label { display: block; margin-top: 19px; font-size: 14px; font-weight: 700; }
    input {
      width: 100%; padding: 12px; margin-top: 7px;
      border: 1px solid #cedce5; border-radius: 9px;
    }
    button {
      width: 100%; margin-top: 24px; padding: 13px;
      border: 0; border-radius: 9px; background: #087e8b;
      color: white; font-weight: 700; cursor: pointer;
    }
    .message { padding: 10px; border-radius: 8px; background: #fff0e9; font-size: 14px; }
    .success { background: #e7f8ee; }
    a { color: #087e8b; }
    .bottom { text-align: center; font-size: 14px; margin-top: 20px; }
  </style>
</head>
<body>
  <main class="card">
    <a class="brand" href="/">✚ MediGuide AI</a>
    <h1>Welcome back</h1>
    <p class="muted">Log in to access your MediGuide AI dashboard.</p>

    {% for category, message in get_flashed_messages(with_categories=true) %}
      <p class="message {{ category }}">{{ message }}</p>
    {% endfor %}

    <form method="POST" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <label for="email">Email address</label>
      <input id="email" name="email" type="email"
             autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required>

      <button type="submit">Log In</button>
    </form>

    <p class="bottom">
      New to MediGuide AI? <a href="/register">Create an account</a>
    </p>
  </main>
</body>
</html>
